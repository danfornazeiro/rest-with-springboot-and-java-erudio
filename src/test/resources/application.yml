server:
  port: 8888
cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://erudio.com.br
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true

logging:
  level:
    com.frnz7.restSpring: DEBUG

springdoc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true