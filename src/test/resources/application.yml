server:
  port: 8888
cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://erudio.com.br
file:
  upload-dir: /felipeCoisas/JAVA/Cursos-Videos/uploadDir
email:
  subject: "Default Subject"
  message: "Default Message"
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  mail:
    host: smt.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
  flyway:
    enabled: true

logging:
  level:
    com.frnz7.restSpring: DEBUG

springdoc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true